name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # uv installs the exact version pinned in .python-version, whatever the
      # runner image: setup-python only ships prebuilt versions per Ubuntu
      # release, and ubuntu-26.04 has no 3.14.2.
      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --all-groups --frozen

      - name: Lint with ruff
        run: uv run ruff check --output-format=github .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Run tests with coverage
        run: uv run pytest -m "not integration"
